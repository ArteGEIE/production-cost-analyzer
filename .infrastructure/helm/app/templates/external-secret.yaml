{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}-secrets
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "app.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    {{- range .Values.externalSecret.secrets }}
    - secretKey: {{ .key }}
      remoteRef:
        # Some providers need a selector prefix here (e.g. Scaleway Secret
        # Manager: `name:<SECRET_NAME>` or `id:<uuid>`); check your ESO provider docs.
        key: {{ .remoteKey }}
        # "None" for raw values, "Base64" when every value in the store is
        # base64-encoded by convention. Avoid "Auto": it silently falls back to
        # the raw value, so a forgotten encoding step reaches the app unnoticed.
        decodingStrategy: {{ $.Values.externalSecret.decodingStrategy }}
    {{- end }}
{{- end }}
